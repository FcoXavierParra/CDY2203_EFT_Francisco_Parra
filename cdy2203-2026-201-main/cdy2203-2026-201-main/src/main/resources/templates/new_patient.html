<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrar Paciente</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" type="text/css" href="/style.css" />
</head>
<body>
<div class="page-container">
    <h1>Registrar nuevo paciente</h1>
    <form id="patientForm" class="patient-form">
        <div>
            <label>Nombre:</label>
            <input type="text" id="name" required />
        </div>
        <div>
            <label>Especie:</label>
            <input type="text" id="species" required />
        </div>
        <div>
            <label>Raza:</label>
            <input type="text" id="breed" required />
        </div>
        <div>
            <label>Edad:</label>
            <input type="number" id="age" min="0" required />
        </div>
        <div>
            <label>Dueño:</label>
            <input type="text" id="owner" required />
        </div>
        <div>
            <label>Email Dueño:</label>
            <input type="email" id="ownerEmail" required />
        </div>
        <div>
            <label>Teléfono Dueño:</label>
            <input type="tel" id="ownerPhone" required />
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-secondary" href="/patients">Cancelar</a>
        </div>
        <div id="errorPatient" style="color: red; margin-top: 1rem;"></div>
    </form>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const editingId = urlParams.get('id');

    async function fillPatientData(id) {
        const token = localStorage.getItem('jwtToken');
        if (!token) { window.location.href = '/login'; return; }

        try {
            const response = await fetch('/api/patients/' + id, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!response.ok) {
                console.error('No se pudo cargar el paciente', response.status);
                return;
            }
            const patient = await response.json();
            document.getElementById('name').value = patient.name || '';
            document.getElementById('species').value = patient.species || '';
            document.getElementById('breed').value = patient.breed || '';
            document.getElementById('age').value = patient.age || '';
            document.getElementById('owner').value = patient.owner || '';
            document.getElementById('ownerEmail').value = patient.ownerEmail || '';
            document.getElementById('ownerPhone').value = patient.ownerPhone || '';
        } catch (err) {
            console.error('Error fetching patient', err);
        }
    }

    if (editingId) {
        document.querySelector('h1').innerText = 'Editar paciente';
        fillPatientData(editingId);
    }

    document.getElementById('patientForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const token = localStorage.getItem('jwtToken');
        if (!token) { window.location.href = '/login'; return; }

        const body = {
            name: document.getElementById('name').value,
            species: document.getElementById('species').value,
            breed: document.getElementById('breed').value,
            age: parseInt(document.getElementById('age').value, 10),
            owner: document.getElementById('owner').value,
            ownerEmail: document.getElementById('ownerEmail').value,
            ownerPhone: document.getElementById('ownerPhone').value
        };

        try {
            const method = editingId ? 'PUT' : 'POST';
            const url = editingId ? '/api/patients/' + editingId : '/api/patients';
            console.log(`-> Frontend: ${method} ${url} body=`, body);
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token,
                },
                body: JSON.stringify(body)
            });
            console.log(`<-- Frontend: ${method} ${url} status=${response.status}`);

            if (response.status === 401 || response.status === 403) {
                localStorage.removeItem('jwtToken');
                window.location.href = '/login';
                return;
            }

            if (!response.ok) {
                const err = await response.text();
                console.error('Frontend: POST /api/patients error response=', err);
                document.getElementById('errorPatient').textContent = 'Error: ' + err;
                return;
            }

            console.log('<- Frontend: POST /api/patients success');
            window.location.href = '/patients';
        } catch (err) {
            console.error('Frontend: POST /api/patients error=', err);
            document.getElementById('errorPatient').textContent = 'Error al guardar paciente.';
        }
    });
</script>
</body>
</html>
